name: liquid_adaptive_nav
description: >-
  Adaptive Apple Liquid Glass navigation bar, foldable & iPhone Duo vertical
  side-strip dock, collapsible macOS sidebar, and Light/Dark theming.
version: 0.0.2
homepage: https://kauscoder.com
repository: https://github.com/KaustavCodes/Flutter-Liquid-Adaptive-Nav
issue_tracker: https://github.com/KaustavCodes/Flutter-Liquid-Adaptive-Nav/issues
topics:
  - navigation
  - liquid-glass
  - foldable
  - adaptive-ui
  - responsive

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  display_posture_detector: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kauscoder.liquid_adaptive_nav
        pluginClass: LiquidAdaptiveNavPlugin
      ios:
        pluginClass: LiquidAdaptiveNavPlugin
      macos:
        pluginClass: LiquidAdaptiveNavPlugin
