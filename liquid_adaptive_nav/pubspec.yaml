name: liquid_adaptive_nav
description: >-
  Adaptive liquid-glass navigation bar, foldable & iPhone Duo vertical side-strip
  dock, collapsible macOS/desktop sidebar, and rich Light/Dark theming built on
  display_posture_detector.
version: 0.0.1
homepage: https://kauscoder.com
repository: https://github.com/KaustavCodes/Flutter-Liquid-Adaptive-Nav
issue_tracker: https://github.com/KaustavCodes/Flutter-Liquid-Adaptive-Nav/issues

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  display_posture_detector: ^0.0.4

# TEMPORARY local override while display_posture_detector 0.0.4 is unreleased on pub.dev.
# Remove this section before running `dart pub publish` once ^0.0.4 is published.
dependency_overrides:
  display_posture_detector:
    path: ../../Flutter-Display-Posture-Detector-Plugin/display_posture_detector

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kauscoder.liquid_adaptive_nav
        pluginClass: LiquidAdaptiveNavPlugin
      ios:
        pluginClass: LiquidAdaptiveNavPlugin
      macos:
        pluginClass: LiquidAdaptiveNavPlugin
