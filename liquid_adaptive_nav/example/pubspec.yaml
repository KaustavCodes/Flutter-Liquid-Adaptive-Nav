name: liquid_adaptive_nav_example
description: "Demonstrates liquid_adaptive_nav across iOS, iPhone Duo, macOS sidebar, Android NavigationBar/NavigationRail, and Light/Dark themes."
publish_to: 'none'

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  liquid_adaptive_nav:
    path: ../
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    # The example Xcode project is already migrated to Swift Package Manager.
    # Keep it on here so `flutter run` still generates FlutterFramework when
    # the global `enable-swift-package-manager` config is off.
    enable-swift-package-manager: true
