name: liquid_adaptive_nav_example
description: "Demonstrates liquid_adaptive_nav across iOS, iPhone Duo, macOS sidebar, Android Material NavigationBar, and Light/Dark themes."
publish_to: 'none'

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  liquid_adaptive_nav:
    path: ../
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
